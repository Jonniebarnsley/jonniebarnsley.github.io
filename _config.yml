# _config.yml
# This file tells Jekyll (the software that builds your site) how to behave.
# It contains global settings for your website.

# Theme: The visual style of your site. 
# 'jekyll-theme-minimal' is clean and focuses on content.
theme: jekyll-theme-minimal

# Site Information
title: Jonnie Barnsley
description: Academic life online

# Personal Information (You can use these throughout your site)
# We can refer to these as {{ site.author_name }} or {{ site.email }} in our pages.
