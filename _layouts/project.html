---
# This layout also inherits from 'default', but adds project-specific features.
layout: default
---

<article>
  <!-- If the page has a title in the front matter, it will be displayed here as an H1 -->
  <h1>{{ page.title }}</h1>
  
  <!-- If the page has a date in the front matter, it will be shown here (formatted as Month Day, Year) -->
  {% if page.date %}
    <p style="color: #666; font-style: italic;">
      Presented: {{ page.date | date: "%B %d, %Y" }}
    </p>
  {% endif %}

  <hr>

  <!-- The actual Markdown content of your project page will be inserted here -->
  {{ content }}

  <hr style="margin-top: 40px;">

  <!-- These links will automatically appear at the bottom of EVERY project page -->
  <p>
    <a href="/projects">&larr; Back to all Projects</a> | 
    <a href="/">Back to Home</a>
  </p>
</article>
